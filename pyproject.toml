[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quixoforge"
version = "0.2.0"
description = "Independently checked, bounded tactical Quixo research engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "QuixoForge contributors"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quixoforge = "quixoforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
