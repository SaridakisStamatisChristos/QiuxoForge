[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quixoforge"
version = "1.1.0"
description = "Verified 2/4-player Quixo engine, exact 3x3 game tablebase and tactical certificates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "QuixoForge contributors"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quixoforge = "quixoforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
quixoforge = ["data/*.gz"]
